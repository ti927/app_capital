<div id="root"></div>
<script>

  var app = h('div', { className: 'lc-root', style: { padding: '20px', background: 'var(--bg)',
      display: 'flex', flexDirection: 'column', gap: '16px' } },

      h('div', { style: { border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', overflow: 'hidden' } },
